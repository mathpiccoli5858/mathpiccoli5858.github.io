<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matheus Piccoli | Light Designer & LED Specialist</title>
    
    <!-- Link do Google Fonts para carregar a fonte 'Inter' corretamente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* Mesma estilização fornecida anteriormente */
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #00f2fe; /* Azul Neon / LED */
            --accent-purple: #4facfe;
            --text-color: #c5c6c7;
            --text-light: #ffffff;
            --whatsapp-color: #25d366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            border-bottom: 4px solid var(--accent-color);
            border-radius: 0 0 20px 20px;
        }

        header h1 {
            font-size: 2.8rem;
            color: var(--text-light);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 1.2rem;
            color: var(--accent-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .carousel {
            margin: 40px auto;
            display: flex;
            overflow: hidden;
            width: 90%;
            max-width: 800px;
            border-radius: 15px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .carousel img {
            min-width: 100%;
            object-fit: cover;
            transition: all 0.5s ease;
        }

        .carousel-buttons {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
        }

        .carousel-buttons button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .carousel-buttons button:hover {
            transform: scale(1.1);
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2rem;
            }
            header p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Botão Flutuante do WhatsApp -->
    <a href="https://wa.me/19998858917" class="wpp-floating" target="_blank">
        💬
    </a>

    <header>
        <div class="container">
            <h1>Matheus Piccoli</h1>
            <p>Light Designer & LED Specialist</p>
        </div>
    </header>

    <div class="carousel">
        <img src="https://via.placeholder.com/800x400" alt="Foto ou vídeo de trabalho 1">
        <img src="https://via.placeholder.com/800x400" alt="Foto ou vídeo de trabalho 2">
        <img src="https://via.placeholder.com/800x400" alt="Foto ou vídeo de trabalho 3">
    </div>

    <script>
        const carousel = document.querySelector('.carousel');
        const images = carousel.querySelectorAll('img');
        let currentIndex = 0;

        function showImage(index) {
            carousel.style.transform = `translateX(-${index * 100}%)`;
        }

        const buttons = document.createElement('div');
        buttons.className = 'carousel-buttons';
        const prevButton = document.createElement('button');
        prevButton.innerHTML = '❮';
        const nextButton = document.createElement('button');
        nextButton.innerHTML = '❯';

        prevButton.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showImage(currentIndex);
        });

        nextButton.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % images.length;
            showImage(currentIndex);
        });

        buttons.appendChild(prevButton);
        buttons.appendChild(nextButton);
        carousel.appendChild(buttons);
    </script>

    <div class="container">
        <section id="sobre">
            <h2>Sobre o Profissional</h2>
            <p>Baseado em Rio Claro (SP) com disponibilidade nacional.</p>
        </section>

        <section id="cta">
            <div class="cta-container">
                <a href="https://instagram.com/piccoli_matheus" target="_blank" class="btn">
                    Ver Portfólio no Instagram
                </a>
                <a href="https://wa.me/19998858917" target="_blank" class="btn btn-wpp">
                    Fale Comigo no WhatsApp
                </a>
            </div>
        </section>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 Matheus Piccoli - Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
